name: SwiftLens
options:
  bundleIdPrefix: me.whynbnb
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_BUNDLE_IDENTIFIER: me.whynbnb.SwiftLens
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SwiftLens/Info.plist
    CODE_SIGN_ENTITLEMENTS: SwiftLens/SwiftLens.entitlements
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: SwiftLens
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  SwiftLens:
    type: application
    platform: macOS
    sources:
      - path: Sources/SwiftLens
      - path: SwiftLens/Assets.xcassets
    info:
      path: SwiftLens/Info.plist
      properties:
        CFBundleDisplayName: SwiftLens
        CFBundleName: SwiftLens
        CFBundleIdentifier: me.whynbnb.SwiftLens
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        CFBundlePackageType: APPL
        CFBundleExecutable: SwiftLens
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 0x574859. MIT License."
        LSUIElement: false
        NSHighResolutionCapable: true
        LSRequiresNativeExecution: true
    entitlements:
      path: SwiftLens/SwiftLens.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
